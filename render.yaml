services:
  - type: web
    name: rize-api
    env: node
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm --filter @rize/api start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rize-db
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
databases:
  - name: rize-db
    databaseName: rize
    user: rize_user
